# GitHub 리포지토리 설정 → Pages → Source: GitHub Actions
# 사이트 URL: https://imseungjun.github.io/somi_beauty/  (리포 이름과 VITE_BASE가 같아야 함)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build (base path = /somi_beauty/)
        run: npm run build
        env:
          VITE_BASE: /somi_beauty/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
