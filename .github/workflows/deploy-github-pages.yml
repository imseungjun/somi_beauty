# Pages 사용: https://github.com/imseungjun/somi_beauty/settings/pages
# → Build and deployment: Source = GitHub Actions (필수, 한 번만 설정)
# 사이트: https://imseungjun.github.io/somi_beauty/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install & build
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE: /somi_beauty/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
