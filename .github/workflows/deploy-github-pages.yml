# 1) 이 워크플로가 돌고 나면 → Settings → Pages
# 2) Build and deployment → Source: "Deploy from a branch"
# 3) Branch: gh-pages  /  Folder: / (root)  → Save
# (지금 "GitHub Actions"로 되어 있으면 위로 바꿔야 imseungjun.github.io/somi_beauty/ 가 열림)
# URL: https://imseungjun.github.io/somi_beauty/
name: Build and push to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE: /somi_beauty/
      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
